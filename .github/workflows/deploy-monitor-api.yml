name: Deploy Monitor API to Cloud Run

on:
  push:
    branches: [main]
    paths:
      - "monitor-app/backend/api/**"
      - ".github/workflows/deploy-monitor-api.yml"
  workflow_dispatch:

env:
  PROJECT_ID: ${{ secrets.GCP_PROJECT_ID }}
  REGION: us-central1
  SERVICE_NAME: webcarga-monitor-api
  REPOSITORY: webcarga
  IMAGE_NAME: monitor-api
  CLOUD_RUN_SA: ${{ secrets.MONITOR_API_CLOUD_RUN_SA }}

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Authenticate to Google Cloud
        uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: ${{ secrets.WIF_PROVIDER }}
          service_account: ${{ secrets.WIF_SA_EMAIL }}

      - name: Set up Cloud SDK
        uses: google-github-actions/setup-gcloud@v2

      - name: Configure Docker for Artifact Registry
        run: gcloud auth configure-docker ${{ env.REGION }}-docker.pkg.dev --quiet

      - name: Build Docker image
        run: |
          docker build \
            -t ${{ env.REGION }}-docker.pkg.dev/${{ env.PROJECT_ID }}/${{ env.REPOSITORY }}/${{ env.IMAGE_NAME }}:${{ github.sha }} \
            -t ${{ env.REGION }}-docker.pkg.dev/${{ env.PROJECT_ID }}/${{ env.REPOSITORY }}/${{ env.IMAGE_NAME }}:latest \
            ./monitor-app/backend/api

      - name: Push Docker image
        run: |
          docker push ${{ env.REGION }}-docker.pkg.dev/${{ env.PROJECT_ID }}/${{ env.REPOSITORY }}/${{ env.IMAGE_NAME }}:${{ github.sha }}
          docker push ${{ env.REGION }}-docker.pkg.dev/${{ env.PROJECT_ID }}/${{ env.REPOSITORY }}/${{ env.IMAGE_NAME }}:latest

      - name: Deploy to Cloud Run
        uses: google-github-actions/deploy-cloudrun@v2
        with:
          service: ${{ env.SERVICE_NAME }}
          region: ${{ env.REGION }}
          image: ${{ env.REGION }}-docker.pkg.dev/${{ env.PROJECT_ID }}/${{ env.REPOSITORY }}/${{ env.IMAGE_NAME }}:${{ github.sha }}
          flags: >-
            --memory=512Mi
            --cpu=1
            --timeout=60
            --concurrency=80
            --min-instances=0
            --max-instances=5
            --service-account=${{ env.CLOUD_RUN_SA }}
            --allow-unauthenticated
            --set-secrets=DATABASE_URL=monitor-api-database-url:latest,SUPABASE_URL=monitor-api-supabase-url:latest,SUPABASE_SERVICE_ROLE_KEY=monitor-api-supabase-service-role-key:latest,ALLOWED_ORIGINS=monitor-api-allowed-origins:latest

      - name: Show service URL
        run: |
          URL=$(gcloud run services describe ${{ env.SERVICE_NAME }} \
            --region=${{ env.REGION }} \
            --format="value(status.url)")
          echo "Service deployed at: ${URL}"
          echo "Health check: ${URL}/health"
