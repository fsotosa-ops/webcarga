[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "webcarga-monitor-api"
version = "1.0.0"
description = "API operacional de master data — transportistas"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "asyncpg>=0.30",
    "pydantic>=2.7",
    "pydantic-settings>=2.3",
    "supabase==2.10.0",
    "upstash-redis>=1.1.0",
    "python-multipart>=0.0.9",
    "openpyxl>=3.1",
    "httpx>=0.27",          # cliente de Graph API (sharepoint_client.py), no solo test
]

[project.optional-dependencies]
dev = [
    "pytest>=8",
    "pytest-asyncio>=0.23",
    # Los tests marcados `integracion` leen SUPABASE_DB_PASSWORD de
    # monitor-app/backend/.env; sin dotenv se saltean solos.
    "python-dotenv>=1.0",
]

[tool.hatch.build.targets.wheel]
packages = ["app"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
# `integracion` = ejecuta SQL contra la base real, dentro de una transaccion
# que siempre termina en ROLLBACK (ver tests/conftest.py).
#   venv/bin/python -m pytest tests/ -q                    # todo
#   venv/bin/python -m pytest tests/ -q -m integracion     # solo integracion
#   venv/bin/python -m pytest tests/ -q -m "not integracion"  # sin tocar la base
markers = [
    "integracion: ejecuta SQL real contra Postgres en una transaccion revertida",
]
